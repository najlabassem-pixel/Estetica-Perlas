<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estética Perlas</title>
     <link rel="stylesheet" href="Perlas.css">
    <!-- Después agregaremos Bootstrap -->
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.carousel-item').forEach(item => {
    const bg = item.getAttribute('data-bg');
    if (bg) {
      item.style.setProperty('--bg-image', `url("${bg}")`);
    }
  });
});
</script>
<body>
     <!-- ⭐ AGREGADO: ESTE ES EL ESPACIO PARA EL LOGO -->
    <header class="header-top py-3">
        <img src="Logo Perlas.png" alt="Logo Estética Perlas" style="width:100px; margin-left:40px;">
    </header>
        <!-- ⭐ FIN DEL AGREGADO -->
    <!-- Bootstrap Navbar -->
    <header>
        <!-- Espacio para logo arriba de la barra -->
<div class="logo-container text-center py-3">
<!-- Aquí luego pondremos la imagen del logo -->
<h1 class="logo-text">Estética Perlas</h1>
</div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#inicio">Estética Perlas</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotras.html"> Nosotras</a></li>
                        <li class="nav-item"><a class="nav-link" href="#servicios">Servicios</a></li>
                        <li class="nav-item"><a class="nav-link" href="#turnos">Turnos</a></li>
                        <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
<!-- Carrusel de fotos -->
<div id="carouselPerlas" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
  <div class="carousel-inner">

    <div class="carousel-item active" data-bg="lashes.jpg">
      <img src="lashes.jpg" class="d-block w-100" alt="lashes.jpg">
    </div>

    <div class="carousel-item" data-bg="manos.jpg">
      <img src="manos.jpg" class="d-block w-100" alt="manos">
    </div>

    <div class="carousel-item" data-bg="depi.jpg">
      <img src="depi.jpg" class="d-block w-100" alt="depi">
    </div>

    <div class="carousel-item" data-bg="mioup.png">
      <img src="mioup.png" class="d-block w-100" alt="mioup">
    </div>

<div class="carousel-item" data-bg="hifu.jpg">
      <img src="hifu.jpg" class="d-block w-100" alt="hifu">
    </div>

  </div>

  <!-- Botones izquierda y derecha -->
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselPerlas" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button class="carousel-control-next" type="button" data-bs-target="#carouselPerlas" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>

</div>
    <script>
        // Aquí irá JavaScript
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
